# Gated off by default: pushes show "skipped" unless the repository variable
# CI_ENABLED is set to 'true', or the workflow is dispatched by hand.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    if: vars.CI_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,raft]"
      - name: Test
        run: pytest
