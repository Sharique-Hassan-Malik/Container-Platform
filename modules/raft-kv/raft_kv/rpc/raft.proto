syntax = "proto3";

package raft;

// ── Raft consensus RPCs ───────────────────────────────────────────────────────

message RequestVoteRequest {
  int64  term           = 1;
  string candidate_id   = 2;
  int64  last_log_index = 3;
  int64  last_log_term  = 4;
}

message RequestVoteResponse {
  int64 term         = 1;
  bool  vote_granted = 2;
}

message AppendEntriesRequest {
  int64             term           = 1;
  string            leader_id      = 2;
  int64             prev_log_index = 3;
  int64             prev_log_term  = 4;
  repeated LogEntry entries        = 5;
  int64             leader_commit  = 6;
}

message AppendEntriesResponse {
  int64 term    = 1;
  bool  success = 2;
  int64 match_index = 3;  // highest log index replicated (for fast recovery)
}

message LogEntry {
  int64  term    = 1;
  int64  index   = 2;
  string command = 3;   // serialised as "SET key value" or "DEL key"
}

// ── Key-value client RPCs ─────────────────────────────────────────────────────

message GetRequest  { string key = 1; }
message GetResponse { string value = 1; bool found = 2; string leader_hint = 3; }

message SetRequest  { string key = 1; string value = 2; }
message SetResponse { bool ok = 1; string leader_hint = 2; string error = 3; }

message DelRequest  { string key = 1; }
message DelResponse { bool ok = 1; string leader_hint = 2; string error = 3; }

message LeaderRequest  {}
message LeaderResponse { string leader_id = 1; string leader_addr = 2; }

// ── Services ──────────────────────────────────────────────────────────────────

service RaftService {
  rpc RequestVote    (RequestVoteRequest)    returns (RequestVoteResponse);
  rpc AppendEntries  (AppendEntriesRequest)  returns (AppendEntriesResponse);
}

service KVService {
  rpc Get    (GetRequest)    returns (GetResponse);
  rpc Set    (SetRequest)    returns (SetResponse);
  rpc Del    (DelRequest)    returns (DelResponse);
  rpc Leader (LeaderRequest) returns (LeaderResponse);
}
